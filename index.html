<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Activos Fijos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Librería avanzada de Excel (xlsx-js-style) para dar formato, colores y estilos -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        
        .theme-night {
            filter: sepia(0.3) brightness(0.9) contrast(1.05) hue-rotate(-10deg);
            background-color: #1c1917; 
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            // ==========================================
            // ESTADO DEL TEMA Y MEMORIA LOCAL
            // ==========================================
            const [temaActivo, setTemaActivo] = useState(() => localStorage.getItem('app_tema') || 'light');

            useEffect(() => {
                localStorage.setItem('app_tema', temaActivo);
                const html = document.documentElement;
                const body = document.body;
                html.classList.remove('dark');
                body.classList.remove('theme-night');
                if (temaActivo === 'dark') html.classList.add('dark');
                if (temaActivo === 'night') { html.classList.add('dark'); body.classList.add('theme-night'); }
            }, [temaActivo]);

            const cambiarTema = () => {
                if (temaActivo === 'light') setTemaActivo('dark');
                else if (temaActivo === 'dark') setTemaActivo('night');
                else setTemaActivo('light');
            };

            const [activos, setActivos] = useState(() => { const g = localStorage.getItem('app_activos'); return g ? JSON.parse(g) : []; });
            const [contadorActas, setContadorActas] = useState(() => { const g = localStorage.getItem('app_contador'); return g ? parseInt(g) : 0; });
            const [empleadosRecientes, setEmpleadosRecientes] = useState(() => { const g = localStorage.getItem('app_empleados'); return g ? JSON.parse(g) : []; });
            
            const [editandoId, setEditandoId] = useState(null);

            const [contextoSesion, setContextoSesion] = useState(() => { 
                const g = localStorage.getItem('app_contexto'); 
                return g ? JSON.parse(g) : { ciudad: 'La Paz', gerencia: '', imgbbKey: '' }; 
            });

            useEffect(() => { localStorage.setItem('app_activos', JSON.stringify(activos)); }, [activos]);
            useEffect(() => { localStorage.setItem('app_contador', contadorActas.toString()); }, [contadorActas]);
            useEffect(() => { localStorage.setItem('app_empleados', JSON.stringify(empleadosRecientes)); }, [empleadosRecientes]);
            useEffect(() => { localStorage.setItem('app_contexto', JSON.stringify(contextoSesion)); }, [contextoSesion]);

            const [guardando, setGuardando] = useState(false);
            const [filtroBusqueda, setFiltroBusqueda] = useState(''); 
            const [filtroFecha, setFiltroFecha] = useState('');
            const [paginaActual, setPaginaActual] = useState(1);
            const itemsPorPagina = 10;

            const LOGO_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzL0ANgclJcSvKlLJDjeHH-tpIbl9SHI9mXg&s";
            
            // ==============================================================
            // NUEVO: URL DE GOOGLE APPS SCRIPT
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxz1EgBePHm7B45uPMg4qlScdpjP2M3ar0tXgEtUjQVupT6seJCVDni6q8vmslT4RsnfQ/exec"; 
            // ==============================================================

            const estadoInicialFormulario = {
                nombre: '', ci: '', cargo: '', cargoEspecifico: '', ubicacionFuncionario: '',
                numeroActaAux: '', estadosRiesgo: ['verde'], codigoActivo: '',
                descripcionActivo: '', ubicacionActivo: '', 
                fotoActivoNombre: '', fotoActivoUrl: '', fotoActivoFile: null, 
                fotoCodigoNombre: '', fotoCodigoUrl: '', fotoCodigoFile: null
            };

            const [formData, setFormData] = useState(estadoInicialFormulario);

            const fileActivoRef = useRef(null);
            const fileCodigoRef = useRef(null);

            const clrs = {
                red: { bg: 'bg-red-50 dark:bg-red-900/20', border: 'border-red-500', text: 'text-red-600 dark:text-red-400', textDark: 'text-red-800 dark:text-red-300', ring: 'ring-red-500', bgLight: 'bg-red-100 dark:bg-red-900/40' },
                orange: { bg: 'bg-orange-50 dark:bg-orange-900/20', border: 'border-orange-500', text: 'text-orange-600 dark:text-orange-400', textDark: 'text-orange-800 dark:text-orange-300', ring: 'ring-orange-500', bgLight: 'bg-orange-100 dark:bg-orange-900/40' },
                yellow: { bg: 'bg-yellow-50 dark:bg-yellow-900/20', border: 'border-yellow-500', text: 'text-yellow-600 dark:text-yellow-400', textDark: 'text-yellow-800 dark:text-yellow-300', ring: 'ring-yellow-500', bgLight: 'bg-yellow-100 dark:bg-yellow-900/40' },
                purple: { bg: 'bg-purple-50 dark:bg-purple-900/20', border: 'border-purple-500', text: 'text-purple-600 dark:text-purple-400', textDark: 'text-purple-800 dark:text-purple-300', ring: 'ring-purple-500', bgLight: 'bg-purple-100 dark:bg-purple-900/40' },
                blue: { bg: 'bg-blue-50 dark:bg-blue-900/20', border: 'border-blue-500', text: 'text-blue-600 dark:text-blue-400', textDark: 'text-blue-800 dark:text-blue-300', ring: 'ring-blue-500', bgLight: 'bg-blue-100 dark:bg-blue-900/40' },
                green: { bg: 'bg-green-50 dark:bg-green-900/20', border: 'border-green-500', text: 'text-green-600 dark:text-green-400', textDark: 'text-green-800 dark:text-green-300', ring: 'ring-green-500', bgLight: 'bg-green-100 dark:bg-green-900/40' },
                slate: { bg: 'bg-slate-100 dark:bg-slate-800', border: 'border-slate-500', text: 'text-slate-600 dark:text-slate-400', textDark: 'text-slate-800 dark:text-slate-300', ring: 'ring-slate-500', bgLight: 'bg-slate-200 dark:bg-slate-700' }
            };

            const opcionesRiesgo = [
                { id: 'rojo', color: 'red', titulo: 'Sin Código / Sin Sistema', iconClass: 'fa-solid fa-circle-exclamation' },
                { id: 'naranja', color: 'orange', titulo: 'Con Código / Sin Sistema', iconClass: 'fa-solid fa-triangle-exclamation' },
                { id: 'amarillo', color: 'yellow', titulo: 'Ubicación Incorrecta', iconClass: 'fa-solid fa-circle-question' },
                { id: 'regional', color: 'purple', titulo: 'Activo Regional', iconClass: 'fa-solid fa-globe' },
                { id: 'azul', color: 'blue', titulo: 'Obsoleto / Para Baja', iconClass: 'fa-solid fa-circle-info' },
                { id: 'revision', color: 'slate', titulo: 'Revisión / Consultar', iconClass: 'fa-solid fa-magnifying-glass-chart' },
                { id: 'verde', color: 'green', titulo: 'Regular', iconClass: 'fa-solid fa-circle-check' }
            ];

            const handleContextoChange = (e) => setContextoSesion({ ...contextoSesion, [e.target.name]: e.target.value });
            const handleInputChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            const handleCheckboxChange = (idRiesgo) => {
                setFormData((prev) => {
                    let nuevosEstados = [...prev.estadosRiesgo];
                    if (nuevosEstados.includes(idRiesgo)) {
                        nuevosEstados = nuevosEstados.filter(r => r !== idRiesgo);
                        if (nuevosEstados.length === 0) nuevosEstados = ['verde'];
                    } else {
                        if (idRiesgo !== 'verde') nuevosEstados = nuevosEstados.filter(r => r !== 'verde');
                        else nuevosEstados = ['verde'];
                        nuevosEstados.push(idRiesgo);
                    }
                    return { ...prev, estadosRiesgo: nuevosEstados };
                });
            };

            const handlePhotoChange = (e, tipo) => {
                const file = e.target.files[0];
                if (file) {
                    const imageUrl = URL.createObjectURL(file); 
                    if(tipo === 'activo') setFormData({ ...formData, fotoActivoUrl: imageUrl, fotoActivoNombre: file.name, fotoActivoFile: file });
                    if(tipo === 'codigo') setFormData({ ...formData, fotoCodigoUrl: imageUrl, fotoCodigoNombre: file.name, fotoCodigoFile: file });
                }
            };

            const autocompletarFuncionario = (emp) => {
                setFormData({ ...formData, nombre: emp.nombre, ci: emp.ci, cargo: emp.cargo, cargoEspecifico: emp.cargoEspecifico, ubicacionFuncionario: emp.ubicacionFuncionario });
            };

            const iniciarEdicion = (activo) => {
                setEditandoId(activo.id);
                setFormData({
                    nombre: activo.nombre || '', 
                    ci: activo.ci || '', 
                    cargo: activo.cargo?.split(' - ')[0] || '', 
                    cargoEspecifico: activo.cargo?.split(' - ')[1] || '', 
                    ubicacionFuncionario: activo.ubicacionFuncionario || '',
                    numeroActaAux: activo.numeroActaAux || '', 
                    estadosRiesgo: activo.estadosRiesgo || ['verde'], 
                    codigoActivo: activo.codigoActivo || '',
                    descripcionActivo: activo.descripcionActivo || '', 
                    ubicacionActivo: activo.ubicacionActivo || '', 
                    fotoActivoNombre: '', fotoActivoUrl: activo.fotoActivoFinal || '', fotoActivoFile: null, 
                    fotoCodigoNombre: '', fotoCodigoUrl: activo.fotoCodigoFinal || '', fotoCodigoFile: null
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const cancelarEdicion = () => {
                setEditandoId(null);
                setFormData(estadoInicialFormulario);
            };

            const eliminarActivo = async (id, numeroActaAux) => {
                if(!window.confirm(`¿Estás seguro de eliminar el registro ${numeroActaAux}?`)) return;
                setActivos(activos.filter(a => a.id !== id));
                // Eliminado de Sheets no soportado nativamente por Google Apps Script simple,
                // la memoria local mandará en el Excel descargado.
            };

            const subirFotoImgBB = async (archivo, apiKey) => {
                const formDataUpload = new FormData();
                formDataUpload.append('image', archivo);
                formDataUpload.append('key', apiKey);
                
                const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formDataUpload });
                const data = await response.json();
                
                if(data.success) return data.data.url;
                throw new Error("No se pudo subir a ImgBB");
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setGuardando(true);
                
                let urlFotoActivo = formData.fotoActivoFile ? 'Procesando...' : (formData.fotoActivoUrl || 'No');
                let urlFotoCodigo = formData.fotoCodigoFile ? 'Procesando...' : (formData.fotoCodigoUrl || 'No');

                if (contextoSesion.imgbbKey) {
                    try {
                        if (formData.fotoActivoFile) urlFotoActivo = await subirFotoImgBB(formData.fotoActivoFile, contextoSesion.imgbbKey);
                        if (formData.fotoCodigoFile) urlFotoCodigo = await subirFotoImgBB(formData.fotoCodigoFile, contextoSesion.imgbbKey);
                    } catch (error) {
                        console.error("Error fotos:", error);
                        alert("Error subiendo fotos a ImgBB.");
                        urlFotoActivo = 'Sí (Fallo Subida)';
                        urlFotoCodigo = 'Sí (Fallo Subida)';
                    }
                } else if (formData.fotoActivoFile || formData.fotoCodigoFile) {
                    if(formData.fotoActivoFile) urlFotoActivo = 'Sí (Sin ImgBB)';
                    if(formData.fotoCodigoFile) urlFotoCodigo = 'Sí (Sin ImgBB)';
                }

                const fechaHoraActual = new Date().toLocaleString('es-BO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const numActaFinal = formData.numeroActaAux || `ACT-AUX-${String(contadorActas + 1).padStart(4, '0')}`;
                const descripcionesRiesgo = formData.estadosRiesgo.map(id => opcionesRiesgo.find(o => o.id === id)?.titulo).join(' + ');

                const activoEditadoExistente = editandoId ? activos.find(a => a.id === editandoId) : null;

                const nuevoActivo = {
                    ...formData, 
                    id: editandoId || Date.now(), 
                    numeroActaAux: numActaFinal,
                    fechaHoraRegistro: editandoId ? activoEditadoExistente.fechaHoraRegistro : fechaHoraActual, 
                    descripcionRiesgo: descripcionesRiesgo,
                    ciudadContexto: contextoSesion.ciudad, 
                    gerenciaContexto: contextoSesion.gerencia,
                    fotoActivoFinal: urlFotoActivo, 
                    fotoCodigoFinal: urlFotoCodigo,
                    estadosRiesgo: formData.estadosRiesgo 
                };

                // Enviar datos a Google Apps Script
                if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "TU_URL_DE_APPS_SCRIPT_AQUI") {
                    try {
                        const payload = {
                            "Acta": nuevoActivo.numeroActaAux + (editandoId ? " (EDITADO)" : ""),
                            "Fecha": nuevoActivo.fechaHoraRegistro,
                            "Ciudad": nuevoActivo.ciudadContexto,
                            "Gerencia": nuevoActivo.gerenciaContexto,
                            "CI": nuevoActivo.ci,
                            "Nombre": nuevoActivo.nombre,
                            "Cargo": `${nuevoActivo.cargo} - ${nuevoActivo.cargoEspecifico}`,
                            "Ubicacion_Resp": nuevoActivo.ubicacionFuncionario,
                            "Codigo": nuevoActivo.codigoActivo || 'S/C',
                            "Descripcion_Activo": nuevoActivo.descripcionActivo,
                            "Ubicacion_Activo": nuevoActivo.ubicacionActivo,
                            "Riesgo": nuevoActivo.descripcionRiesgo,
                            "Foto_Activo": nuevoActivo.fotoActivoFinal,
                            "Foto_Codigo": nuevoActivo.fotoCodigoFinal
                        };

                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors', // Evita el error de CORS en el navegador
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify(payload)
                        });
                        // Como usamos no-cors, asumimos éxito si no lanza error de red.
                    } catch (error) {
                        console.error(error);
                        alert("Guardado localmente, pero falló la red hacia Sheets.");
                    }
                }

                if (editandoId) {
                    setActivos(activos.map(a => a.id === editandoId ? nuevoActivo : a));
                    setEditandoId(null);
                } else {
                    setActivos([nuevoActivo, ...activos]);
                    setContadorActas(contadorActas + 1);
                }
                
                if(formData.nombre) {
                    setEmpleadosRecientes((prev) => {
                        const existe = prev.find(e => e.nombre === formData.nombre);
                        if (existe) return prev;
                        return [{ nombre: formData.nombre, ci: formData.ci, cargo: formData.cargo, cargoEspecifico: formData.cargoEspecifico, ubicacionFuncionario: formData.ubicacionFuncionario }, ...prev].slice(0, 5); 
                    });
                }

                setFormData(estadoInicialFormulario);
                setGuardando(false);
                setPaginaActual(1);
            };

            const exportToExcel = () => {
                try {
                    if (activos.length === 0) return alert("No hay datos para exportar.");
                    if (typeof XLSX === 'undefined') {
                        return alert("Cargando herramientas de Excel... por favor espera un segundo y vuelve a intentar.");
                    }

                    const datosParaExcel = activos.map(a => ({
                        "Nº Acta": a.numeroActaAux, "Fecha de Registro": a.fechaHoraRegistro,
                        "Ciudad": a.ciudadContexto, "Gerencia/Área": a.gerenciaContexto,
                        "C.I. Custodio": a.ci, "Nombre Custodio": a.nombre, "Cargo Completo": `${a.cargo} - ${a.cargoEspecifico}`,
                        "Oficina Custodio": a.ubicacionFuncionario, "CÓDIGO": a.codigoActivo || 'S/C',
                        "Descripción del Activo": a.descripcionActivo, "Ubicación Hallada": a.ubicacionActivo, 
                        "Clasificación / Riesgo": a.descripcionRiesgo,
                        "Enlace Foto Activo": a.fotoActivoFinal, "Enlace Foto Código": a.fotoCodigoFinal
                    }));

                    const worksheet = XLSX.utils.json_to_sheet(datosParaExcel);
                    
                    // ESTILOS AVANZADOS PARA EXCEL
                    const rango = XLSX.utils.decode_range(worksheet['!ref']);
                    
                    // 1. Aplicar estilo al encabezado (Primera fila)
                    for (let C = rango.s.c; C <= rango.e.c; ++C) {
                        const celda = XLSX.utils.encode_col(C) + "1";
                        if (!worksheet[celda]) continue;
                        worksheet[celda].s = {
                            fill: { fgColor: { rgb: "1E3A8A" } }, // Azul oscuro
                            font: { color: { rgb: "FFFFFF" }, bold: true }, // Letra blanca y negrita
                            alignment: { horizontal: "center", vertical: "center" }
                        };
                    }

                    // 2. Activar Autofiltros
                    worksheet['!autofilter'] = { ref: worksheet['!ref'] };

                    // 3. Ajustar el ancho de las columnas
                    worksheet['!cols'] = [
                        { wch: 15 }, { wch: 22 }, { wch: 15 }, { wch: 20 },
                        { wch: 15 }, { wch: 30 }, { wch: 25 }, { wch: 20 },
                        { wch: 20 }, { wch: 45 }, { wch: 25 }, { wch: 35 },
                        { wch: 20 }, { wch: 20 }
                    ];

                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Inventario");
                    XLSX.writeFile(workbook, `Reporte_Inventario_${new Date().toISOString().split('T')[0]}.xlsx`);
                } catch (error) {
                    console.error("Error al exportar:", error);
                    alert("Error generando Excel. Asegúrate de tener conexión para descargar la librería.");
                }
            };

            const activosFiltrados = activos.filter(a => {
                const coincideTexto = a.numeroActaAux.toLowerCase().includes(filtroBusqueda.toLowerCase()) || (a.nombre && a.nombre.toLowerCase().includes(filtroBusqueda.toLowerCase())) || (a.codigoActivo && a.codigoActivo.toLowerCase().includes(filtroBusqueda.toLowerCase()));
                let coincideFecha = true;
                if (filtroFecha) {
                    const f = filtroFecha.split('-');
                    coincideFecha = a.fechaHoraRegistro.startsWith(`${f[2]}/${f[1]}/${f[0]}`);
                }
                return coincideTexto && coincideFecha;
            });

            const indexUltimoItem = paginaActual * itemsPorPagina;
            const indexPrimerItem = indexUltimoItem - itemsPorPagina;
            const activosPaginados = activosFiltrados.slice(indexPrimerItem, indexUltimoItem);
            const totalPaginas = Math.ceil(activosFiltrados.length / itemsPorPagina);

            useEffect(() => { setPaginaActual(1); }, [filtroBusqueda, filtroFecha]);

            return (
                <div className="min-h-screen p-2 md:p-6 font-sans text-slate-800 dark:text-slate-200 transition-colors duration-300">
                    <div className="max-w-7xl mx-auto space-y-4">
                        
                        {/* Cabecera */}
                        <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-4 flex flex-col md:flex-row justify-between items-center gap-4 transition-colors">
                            <div className="flex items-center gap-4 w-full md:w-auto">
                                <img src={LOGO_URL} alt="Logo" className="h-14 w-14 rounded-full object-cover border-2 border-slate-100 dark:border-slate-600 shadow-sm" />
                                <div>
                                    <h1 className="text-xl md:text-2xl font-bold leading-tight">Auditoría de Activos</h1>
                                    <p className="text-slate-500 dark:text-slate-400 text-xs">V9 • Edición + Excel Pro</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                                <div className="text-center bg-slate-50 dark:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600">
                                    <span className="block text-slate-500 dark:text-slate-300 font-semibold text-[9px] uppercase tracking-wider">Registros</span>
                                    <span className="text-xl font-black text-blue-600 dark:text-blue-400">{activos.length}</span>
                                </div>
                                {activos.length > 0 && (
                                    <button onClick={exportToExcel} className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg text-sm font-bold shadow-sm">
                                        <i className="fa-solid fa-file-excel"></i> <span className="hidden md:inline">Descargar XLSX</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 pb-20">
                            
                            {/* FORMULARIO */}
                            <div className="lg:col-span-5 space-y-4">
                                <div className="bg-slate-800 dark:bg-slate-950 rounded-xl shadow-sm border border-slate-700 p-4">
                                    <h2 className="text-sm font-bold text-white mb-3 flex items-center gap-2"><i className="fa-solid fa-sliders text-blue-400"></i> Configuración de la Sesión</h2>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-[10px] font-semibold text-slate-300 mb-1">CIUDAD / SEDE</label>
                                            <input type="text" name="ciudad" value={contextoSesion.ciudad} onChange={handleContextoChange} className="w-full px-3 py-1.5 bg-slate-700 dark:bg-slate-800 border border-slate-600 text-white rounded-md text-sm outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-semibold text-slate-300 mb-1">GERENCIA / ÁREA</label>
                                            <input type="text" name="gerencia" value={contextoSesion.gerencia} onChange={handleContextoChange} className="w-full px-3 py-1.5 bg-slate-700 dark:bg-slate-800 border border-slate-600 text-white rounded-md text-sm outline-none" />
                                        </div>
                                        <div className="col-span-2 mt-2 pt-3 border-t border-slate-600">
                                            <label className="block text-[10px] font-semibold text-slate-300 mb-1 uppercase">Clave API de ImgBB (Fotos a la nube)</label>
                                            <input type="password" name="imgbbKey" value={contextoSesion.imgbbKey} onChange={handleContextoChange} className="w-full px-3 py-1.5 bg-slate-700 dark:bg-slate-800 border border-slate-600 text-white rounded-md text-sm outline-none font-mono" placeholder="Pega tu API Key de ImgBB aquí..." />
                                        </div>
                                    </div>
                                </div>

                                <form onSubmit={handleSubmit} className={`rounded-xl shadow-sm border p-5 md:p-6 transition-colors ${editandoId ? 'bg-amber-50 dark:bg-amber-900/10 border-amber-200 dark:border-amber-700/50' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700'}`}>
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-sm font-bold flex items-center gap-2 uppercase tracking-wider text-slate-800 dark:text-slate-200">
                                            {editandoId ? <><i className="fa-solid fa-pen text-amber-500"></i> Modificando: {formData.numeroActaAux}</> : <><i className="fa-solid fa-user text-blue-500"></i> 1. Custodio</>}
                                        </h2>
                                        {editandoId && (
                                            <button type="button" onClick={cancelarEdicion} className="text-xs font-bold text-red-500 hover:text-red-700 underline bg-white/50 px-2 py-1 rounded">
                                                Cancelar
                                            </button>
                                        )}
                                    </div>

                                    <div className="space-y-3 mb-6">
                                        <div><input type="text" name="nombre" value={formData.nombre} onChange={handleInputChange} className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-md text-sm outline-none" placeholder="Nombre (Opcional)" /></div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <input type="text" name="ci" value={formData.ci} onChange={handleInputChange} className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-md text-sm outline-none" placeholder="C.I." />
                                            <input type="text" name="numeroActaAux" value={formData.numeroActaAux} onChange={handleInputChange} className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-600 rounded-md text-sm outline-none font-bold" placeholder="Acta (Auto)" readOnly={!!editandoId} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <input type="text" name="cargo" value={formData.cargo} onChange={handleInputChange} className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-md text-sm outline-none" placeholder="Cargo" />
                                            <input type="text" name="cargoEspecifico" value={formData.cargoEspecifico} onChange={handleInputChange} className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-md text-sm outline-none" placeholder="Específico" />
                                        </div>
                                        <input type="text" name="ubicacionFuncionario" value={formData.ubicacionFuncionario} onChange={handleInputChange} className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-md text-sm outline-none" placeholder="Oficina / Área" />
                                    </div>

                                    <div>
                                        <h2 className="text-sm font-bold mb-3 pb-2 border-b border-slate-100 dark:border-slate-700 flex items-center gap-2"><i className="fa-solid fa-hashtag text-blue-500"></i> 2. Detalle Activo</h2>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mb-4">
                                            {opcionesRiesgo.map((opcion) => (
                                                <div key={opcion.id} onClick={() => handleCheckboxChange(opcion.id)} className={`flex items-center p-2 border rounded-lg cursor-pointer transition-all ${formData.estadosRiesgo.includes(opcion.id) ? `${clrs[opcion.color].bg} ${clrs[opcion.color].border}` : 'bg-white dark:bg-slate-700 border-slate-200 dark:border-slate-600'}`}>
                                                    <div className={`mr-2 ${clrs[opcion.color].text}`}>
                                                        {formData.estadosRiesgo.includes(opcion.id) ? <i className="fa-solid fa-square-check"></i> : <i className="fa-regular fa-square text-slate-300 dark:text-slate-500"></i>}
                                                    </div>
                                                    <span className={`text-[11px] font-bold ${formData.estadosRiesgo.includes(opcion.id) ? clrs[opcion.color].textDark : 'text-slate-700 dark:text-slate-300'}`}>{opcion.titulo}</span>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="col-span-2">
                                                <label className="block text-xs font-bold text-slate-500 mb-1">CÓDIGO (Opcional)</label>
                                                <input type="text" name="codigoActivo" value={formData.codigoActivo} onChange={handleInputChange} className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-md text-sm font-mono uppercase outline-none" placeholder="Ej. AF-12345" />
                                            </div>
                                            
                                            <div className="col-span-1">
                                                <button type="button" onClick={() => fileActivoRef.current.click()} className="w-full flex flex-col items-center gap-1 p-2 bg-slate-50 dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 border border-slate-300 dark:border-slate-600 rounded-md text-xs font-medium transition-colors">
                                                    <i className="fa-solid fa-camera text-blue-500"></i> {formData.fotoActivoNombre || formData.fotoActivoUrl ? 'Cambiar Foto Activo' : 'Foto Activo'}
                                                </button>
                                                <input type="file" accept="image/*" className="hidden" ref={fileActivoRef} onChange={(e) => handlePhotoChange(e, 'activo')} capture="environment" />
                                                {(formData.fotoActivoNombre || formData.fotoActivoUrl) && <p className="text-[9px] text-emerald-600 dark:text-emerald-400 mt-1 truncate">✓ Cargada</p>}
                                            </div>
                                            <div className="col-span-1">
                                                <button type="button" onClick={() => fileCodigoRef.current.click()} className="w-full flex flex-col items-center gap-1 p-2 bg-slate-50 dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 border border-slate-300 dark:border-slate-600 rounded-md text-xs font-medium transition-colors">
                                                    <i className="fa-solid fa-barcode text-purple-500"></i> {formData.fotoCodigoNombre || formData.fotoCodigoUrl ? 'Cambiar Foto Código' : 'Foto CÓDIGO'}
                                                </button>
                                                <input type="file" accept="image/*" className="hidden" ref={fileCodigoRef} onChange={(e) => handlePhotoChange(e, 'codigo')} capture="environment" />
                                                {(formData.fotoCodigoNombre || formData.fotoCodigoUrl) && <p className="text-[9px] text-emerald-600 dark:text-emerald-400 mt-1 truncate">✓ Cargada</p>}
                                            </div>

                                            <div className="col-span-2">
                                                <textarea name="descripcionActivo" value={formData.descripcionActivo} onChange={handleInputChange} rows="2" className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-md text-sm outline-none" placeholder="Descripción: Marca, Modelo, Color..."></textarea>
                                            </div>
                                            <div className="col-span-2">
                                                <input type="text" name="ubicacionActivo" value={formData.ubicacionActivo} onChange={handleInputChange} className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-md text-sm outline-none" placeholder="Ubicación Física (Ej. En estante)" />
                                            </div>
                                        </div>

                                        <button type="submit" disabled={guardando} className={`w-full mt-4 flex justify-center items-center gap-2 text-white px-4 py-4 rounded-lg text-sm font-black uppercase shadow-md ${guardando ? 'bg-slate-400' : (editandoId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-blue-600 hover:bg-blue-700')}`}>
                                            {guardando ? <><i className="fa-solid fa-spinner fa-spin"></i> Procesando...</> : (editandoId ? <><i className="fa-solid fa-pen-to-square"></i> Actualizar Registro</> : <><i className="fa-solid fa-cloud-arrow-up"></i> Guardar Nuevo Registro</>)}
                                        </button>
                                    </div>
                                </form>
                            </div>

                            {/* LISTA DERECHA */}
                            <div className="lg:col-span-7 flex flex-col h-full max-h-[90vh]">
                                <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-3 mb-4 flex flex-col md:flex-row gap-2">
                                    <div className="relative flex-1">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                        <input type="text" placeholder="Buscar Acta, Nombre, Código..." value={filtroBusqueda} onChange={(e) => setFiltroBusqueda(e.target.value)} className="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm outline-none" />
                                    </div>
                                    <div className="relative flex-1 md:max-w-[200px]">
                                        <input type="date" value={filtroFecha} onChange={(e) => setFiltroFecha(e.target.value)} className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm outline-none" />
                                    </div>
                                    {(filtroBusqueda || filtroFecha) && (<button onClick={() => {setFiltroBusqueda(''); setFiltroFecha('');}} className="px-3 py-2 text-red-500 bg-red-50 dark:bg-red-900/20 rounded-lg text-sm font-bold">Limpiar</button>)}
                                </div>

                                <div className="flex flex-col flex-1 overflow-hidden">
                                    <div className="flex justify-between items-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-t-lg p-2 shrink-0">
                                        <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">Mostrando {activosFiltrados.length > 0 ? indexPrimerItem + 1 : 0}-{Math.min(indexUltimoItem, activosFiltrados.length)} de {activosFiltrados.length}</span>
                                        <div className="flex gap-1">
                                            <button disabled={paginaActual === 1} onClick={() => setPaginaActual(paginaActual - 1)} className="px-2 py-1 bg-slate-100 dark:bg-slate-700 disabled:opacity-50 rounded text-xs font-bold"><i className="fa-solid fa-chevron-left"></i></button>
                                            <span className="px-2 py-1 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded text-xs font-bold">Pág {paginaActual}/{totalPaginas || 1}</span>
                                            <button disabled={paginaActual === totalPaginas || totalPaginas === 0} onClick={() => setPaginaActual(paginaActual + 1)} className="px-2 py-1 bg-slate-100 dark:bg-slate-700 disabled:opacity-50 rounded text-xs font-bold"><i className="fa-solid fa-chevron-right"></i></button>
                                        </div>
                                    </div>

                                    <div className="space-y-3 overflow-y-auto pr-1 py-3 custom-scrollbar flex-1 bg-slate-50 dark:bg-slate-900 border-l border-r border-slate-200 dark:border-slate-700 px-2">
                                        {activosPaginados.map((activo) => {
                                            const riesgoPrincipal = activo.estadosRiesgo[0] || 'verde';
                                            const colorInfo = opcionesRiesgo.find(o => o.id === riesgoPrincipal);
                                            const bordeRiesgo = clrs[colorInfo.color].border;

                                            return (
                                                <div key={activo.id} className={`rounded-xl border-l-[6px] shadow-sm p-4 bg-white dark:bg-slate-800 ${bordeRiesgo} relative group`}>
                                                    
                                                    {/* BOTONES FLOTANTES (EDITAR Y BORRAR) */}
                                                    <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity flex gap-2">
                                                        <button onClick={() => iniciarEdicion(activo)} className="text-white bg-blue-500 hover:bg-blue-600 px-3 py-1.5 rounded-lg text-xs font-bold shadow-md" title="Editar Registro"><i className="fa-solid fa-pen"></i></button>
                                                        <button onClick={() => eliminarActivo(activo.id, activo.numeroActaAux)} className="text-white bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg text-xs font-bold shadow-md" title="Eliminar Registro"><i className="fa-solid fa-trash-can"></i></button>
                                                    </div>
                                                    
                                                    <div className="flex justify-between items-center mb-2 pr-20">
                                                        <span className="bg-slate-800 dark:bg-slate-950 text-white px-2 py-1 rounded text-[10px] font-bold font-mono">{activo.numeroActaAux}</span>
                                                        <div className="flex gap-2">
                                                            {activo.fotoActivoFinal && activo.fotoActivoFinal !== 'No' && !activo.fotoActivoFinal.includes('Fallo') && !activo.fotoActivoFinal.includes('Sin ImgBB') && <a href={activo.fotoActivoFinal} target="_blank" className="text-blue-500 hover:text-blue-700" title="Ver Foto Activo"><i className="fa-solid fa-image"></i></a>}
                                                            {activo.fotoCodigoFinal && activo.fotoCodigoFinal !== 'No' && !activo.fotoCodigoFinal.includes('Fallo') && !activo.fotoCodigoFinal.includes('Sin ImgBB') && <a href={activo.fotoCodigoFinal} target="_blank" className="text-purple-500 hover:text-purple-700" title="Ver Foto Código"><i className="fa-solid fa-barcode"></i></a>}
                                                        </div>
                                                    </div>

                                                    <h3 className="font-black text-lg">{activo.codigoActivo ? `Cód: ${activo.codigoActivo}` : 'Sin Código (S/C)'}</h3>
                                                    <p className="text-sm font-medium mb-3 opacity-80">{activo.descripcionActivo || 'Sin descripción'}</p>
                                                    
                                                    <div className="grid grid-cols-2 gap-1 text-[11px] bg-slate-50 dark:bg-slate-700/50 p-2 rounded-lg mt-1">
                                                        <div className="truncate"><i className="fa-solid fa-user text-blue-500 w-3"></i> {activo.nombre || 'Anónimo'}</div>
                                                        <div className="truncate"><i className="fa-solid fa-location-dot text-red-500 w-3"></i> {activo.ubicacionActivo || 'N/A'}</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button 
                        onClick={cambiarTema}
                        className="fixed bottom-6 right-6 h-14 w-14 rounded-full shadow-2xl flex items-center justify-center text-xl transition-all hover:scale-110 active:scale-95 z-50
                        bg-slate-800 text-yellow-400 dark:bg-slate-100 dark:text-slate-800 theme-night:bg-amber-600 theme-night:text-white"
                        title="Cambiar Tema (Claro / Oscuro / Nocturno)"
                    >
                        {temaActivo === 'light' && <i className="fa-solid fa-moon"></i>}
                        {temaActivo === 'dark' && <i className="fa-solid fa-eye" title="Modo Nocturno (Sepia)"></i>}
                        {temaActivo === 'night' && <i className="fa-solid fa-sun"></i>}
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
